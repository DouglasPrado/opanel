# PostgreSQL holds Desired State — the configuration the user approved. It is the
# source of truth of the Control Plane; Docker Swarm holds Actual State and is
# always observed, never assumed from this database.
#
# Credentials come from the environment, never from this file. The typed
# declaration of the required keys, and the fail-closed boot when one is missing
# or malformed, are M00-16's scope.
#
# DATABASE_URL, when present, is merged on top of these values by Rails.
default: &default
  adapter: postgresql
  encoding: unicode
  # Explicit pool sizing. The default follows the Puma thread count so a request
  # can never wait on a checkout that the server itself made impossible.
  max_connections: <%= ENV.fetch("OPANEL_DATABASE_MAX_CONNECTIONS") { ENV.fetch("RAILS_MAX_THREADS", 5) } %>
  checkout_timeout: <%= ENV.fetch("OPANEL_DATABASE_CHECKOUT_TIMEOUT", 5) %>
  host: <%= ENV.fetch("OPANEL_DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("OPANEL_DATABASE_PORT", 5432) %>
  username: <%= ENV["OPANEL_DATABASE_USERNAME"] %>
  password: <%= ENV["OPANEL_DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("OPANEL_DATABASE_NAME", "opanel_development") %>

# The test database is distinct from development and is recreated at will.
# Parallel workers get their own suffixed database, so the name here is a prefix.
test:
  <<: *default
  database: <%= ENV.fetch("OPANEL_TEST_DATABASE_NAME", "opanel_test") %>

# CI runs the suite with eager loading on, against its own ephemeral database.
# Keeping it a separate environment means a CI-only load failure cannot hide
# behind development's lazy autoloading.
ci:
  <<: *default
  database: <%= ENV.fetch("OPANEL_CI_DATABASE_NAME", "opanel_ci") %>

production:
  <<: *default
  database: <%= ENV.fetch("OPANEL_DATABASE_NAME", "opanel_production") %>
