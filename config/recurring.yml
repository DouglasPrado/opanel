#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  observe_cluster_nodes:
    class: ObserveClusterNodesJob
    queue: default
    schedule: every 30 seconds
  publish_outbox_events:
    class: PublishOutboxEventsJob
    queue: system
    schedule: every <%= ENV.fetch("OPANEL_OUTBOX_DISPATCHER_CADENCE_SECONDS", "5") %> seconds
  recover_stalled_operations:
    class: RecoverStalledOperationsJob
    queue: system
    schedule: every <%= ENV.fetch("OPANEL_RECOVERY_SWEEP_CADENCE_SECONDS", "30") %> seconds
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
