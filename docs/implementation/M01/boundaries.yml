    # O spec que caiu em paralelo: a asserção passa a nomear a causa
    # (`unreachable_reason`) em vez de só o status, para que a próxima falha
    # diga o quê, não só que.
    - spec/integration/swarm_bootstrap_lab_spec.rb
    # `bin/gate` é negado pelo hook ao implementer; o flip para `--parallel` e
    # para `bin/security --diff` vai como patch reproduzido no relatório, como
    # na M01-92. Fica declarado porque a Story o toca — pelas mãos do operador.

