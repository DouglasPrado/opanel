  M01-17:
    # The first real reconciler, and deliberately the simplest resource: a
    # network has no rollout, no health policy and no replicas, so what is being
    # proved here is the algorithm of doc 07 §11.3 — lease, read desired, observe
    # actual, diff with no side effect, apply the smallest safe change,
    # **re-inspect**, persist, release — and not the resource.
    - db/migrate/*.rb
    - db/schema.rb
    # Domain: the network, and the per-run record that makes a reconcile
    # auditable without reproducing it.
    - app/models/network.rb
    - app/models/reconciliation_run.rb
