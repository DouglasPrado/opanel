# The declared boundary of each Story in this Milestone.
#
# "Changes outside the declared boundary are a review finding even when the code
# is correct" (AGENT_RULES, "Scope Discipline"). That rule needs something to
# compare against, so a Story declares the paths it may touch **before** editing:
# a boundary written afterwards only describes what happened.
#
# `bin/gate pre-commit --story <id>` and `bin/gate post-commit --story <id>` read
# this. A Story with no entry here fails the boundary check rather than passing
# it — a check satisfied by never declaring anything reports green over exactly
# the scope creep it exists to catch.
#
# Patterns are shell globs matched against repository-relative paths (`**`
# crosses directories). The pack's own bookkeeping — tasks.json, reports, review,
# evidence, this file — is always allowed and does not need declaring.
#
# Widening a boundary is a deliberate act: do it in the commit that needs it, and
# say why in the Story report. Widening it silently to make a gate pass is the
# thing this prevents.

boundaries:
  # The two Stories numbered outside the Milestone's range are the ones allowed
  # to touch the loop and the gates, because no Story may edit the machinery that
  # judges it from inside the work being judged. G02 authorises them explicitly
  # and requires each to be committed on its own, before any domain Story.

  M01-91:
    # The local gate's test invocation and its secret-scan scope — the two
    # decisions the Story changes.
    - bin/gate
    - bin/security
    - bin/test
    # The gate suites that re-entered the repository, and the budget spec that
    # keeps the recursion from coming back.
    - spec/gates/**
    # The five examples that are not parallel-safe, which is what AC 5 blocks on.
    - spec/security/production_logging_spec.rb
    - spec/security/security_scan_spec.rb
    - spec/spec_helper.rb
    - spec/support/**

  # The first domain Story: it creates the identity tables, the platform-wide
  # identifier layer and the authentication surface. Wider than a later Story
  # will be, for one structural reason — it switches the application to
  # deny-by-default, so every controller that already existed must declare its
  # access and every request spec that exercised an open route needs a signed-in
  # user. Those files are listed individually rather than as `app/controllers/**`
  # so the boundary still says no to a controller this Story has no business in.
  M01-01:
    # Schema: the first three domain migrations and the regenerated dump.
    - db/migrate/*.rb
    - db/schema.rb
    # Domain.
    - app/models/user.rb
    - app/models/session.rb
    - app/models/authentication_attempt.rb
    - app/models/concerns/ulid_primary_key.rb
    # Application layer.
    - app/commands/register_user.rb
    - app/commands/authenticate_user.rb
    - app/commands/revoke_session.rb
    - app/queries/user_sessions.rb
    # Delivery. The four pre-existing controllers are here only because
    # deny-by-default forces each to state whether it is public.
    - app/controllers/application_controller.rb
    - app/controllers/errors_controller.rb
    - app/controllers/gallery_controller.rb
    - app/controllers/home_controller.rb
    - app/controllers/sessions_controller.rb
    - app/controllers/registrations_controller.rb
    - app/controllers/concerns/authentication.rb
    - app/controllers/concerns/error_envelope.rb
    # UI. Pages and one feature component; no primitive under ui/ is touched.
    - app/frontend/pages/Auth/**
    - app/frontend/pages/Account/**
    - app/frontend/components/features/auth/**
    # Platform library: the identifier layer ADR-0002 requires, the KDF wrapper
    # Annex B §13 requires, and the Result shape the Commands return.
    - lib/opanel/identifier.rb
    - lib/opanel/password_hashing.rb
    - lib/opanel/result.rb
    # Configuration. fitness.yml is *widened* here (session_token joins the
    # sensitive field names) — never narrowed.
    - config/application.rb
    - config/routes.rb
    - config/initializers/session_store.rb
    - config/architecture/fitness.yml
    # Tests.
    - spec/factories/users.rb
    - spec/factories/sessions.rb
    - spec/unit/identifier_spec.rb
    - spec/unit/password_hashing_spec.rb
    - spec/unit/password_policy_spec.rb
    - spec/unit/session_expiry_spec.rb
    - spec/unit/authentication_attempt_spec.rb
    - spec/integration/user_registration_spec.rb
    - spec/integration/user_authentication_spec.rb
    - spec/integration/session_revocation_spec.rb
    - spec/integration/login_rate_limit_spec.rb
    - spec/requests/authentication_spec.rb
    - spec/requests/session_cookie_spec.rb
    - spec/requests/error_envelope_spec.rb
    - spec/requests/account_sessions_spec.rb
    - spec/requests/root_spec.rb
    - spec/requests/gallery_spec.rb
    - spec/requests/inertia_spec.rb
    - spec/requests/csrf_and_errors_spec.rb
    - spec/security/password_storage_spec.rb
    - spec/security/login_response_indistinguishability_spec.rb
    - spec/security/authentication_logging_spec.rb
    # The Argon2id dependency (Annex B §13); justified in the Story report.
    - Gemfile
    - Gemfile.lock
    # SC-17 was found by this Story and is recorded by it.
    - docs/implementation/SPEC_CONFLICTS.md

  # Team e a invariante de OWNER único. O centro da Story é o banco: a Story se
  # resolve em duas migrations, dois models, dois Commands e uma Query. A rota e
  # a página existem porque o AC8 exige provar que o acesso some na requisição
  # seguinte, e não pode haver rota Inertia sem página — mas a UI de produto é
  # de M01-22, então aqui a página é mínima e composta de primitivos existentes.
  M01-02:
    # Schema: as duas migrations expand e o dump regenerado.
    - db/migrate/*_create_teams.rb
    - db/migrate/*_create_team_members.rb
    - db/schema.rb
    # Registro do prefixo do novo tipo (ADR-0002 §3): team_member -> "tm".
    - lib/opanel/identifier.rb
    - spec/unit/identifier_spec.rb
    # Domínio.
    - app/models/team.rb
    - app/models/team_member.rb
    # Camada de aplicação.
    - app/commands/create_team.rb
    - app/commands/suspend_team_member.rb
    - app/queries/teams_for_user.rb
    # Entrega mínima: uma rota e a página que provam AC1 e AC8.
    - app/controllers/teams_controller.rb
    - config/routes.rb
    - app/frontend/pages/Teams/*.tsx
    # Testes.
    - spec/factories/teams.rb
    - spec/factories/team_members.rb
    - spec/unit/team_member_spec.rb
    - spec/integration/team_ownership_constraints_spec.rb
    - spec/integration/team_ownership_concurrency_spec.rb
    - spec/policies/team_membership_access_spec.rb
    - spec/requests/teams_spec.rb
    - spec/security/team_ownership_escalation_spec.rb
    # Onde as divergências que a Story encontrou contra o doc 04 são registradas.
    - docs/decisions/pending-documentation-updates.md

  # InstanceRole e o bootstrap da primeira instalação. Toca `RegisterUser` porque
  # o bootstrap acontece dentro do primeiro cadastro (doc 04 §3.1) — não é uma
  # rota nova, é uma consequência atômica da que já existe. Sem UI: a área de
  # administração da instância é de M11-12, e nenhum AC desta Story pede tela.
  M01-03:
    - db/migrate/*_create_instance_roles.rb
    - db/schema.rb
    - lib/opanel/identifier.rb
    - spec/unit/identifier_spec.rb
    # Domínio.
    - app/models/instance_role.rb
    # Camada de aplicação. RegisterUser passa a conter o bootstrap; CreateTeam é
    # tocado só para provar, por teste, que um Team posterior não concede nada
    # além de TEAM_OWNER.
    - app/commands/register_user.rb
    - app/commands/bootstrap_installation.rb
    - app/commands/grant_instance_role.rb
    - app/commands/revoke_instance_role.rb
    - app/queries/installation_bootstrap_state.rb
    # Testes.
    - spec/factories/instance_roles.rb
    - spec/unit/instance_role_spec.rb
    - spec/integration/installation_bootstrap_spec.rb
    - spec/integration/installation_bootstrap_concurrency_spec.rb
    - spec/integration/instance_role_revocation_spec.rb
    # Acrescentado na rodada de correção: o AC5 concorrente não tinha exemplo,
    # e a revisão mostrou que o lock deadlockava em vez de recusar.
    - spec/integration/instance_role_revocation_concurrency_spec.rb
    - spec/policies/instance_role_grant_spec.rb
    - spec/security/instance_admin_escalation_spec.rb
    - spec/integration/user_registration_spec.rb

  # A fundação de autorização. É a Story mais estruturante do Milestone: tudo o
  # que vier depois passa por aqui, e por isso ela toca os Commands e Queries que
  # já existem — para provar a fundação contra código real em vez de contra um
  # exemplo. Só as Policies das entidades que existem hoje são criadas; Project,
  # Environment, Service e Cluster nascem com as suas próprias Stories, usando
  # esta base.
  M01-04:
    # A camada.
    - app/policies/application_policy.rb
    - app/policies/team_policy.rb
    - app/queries/tenant_scope.rb
    - lib/opanel/authorization.rb
    # AC5 tem duas metades: o helper que facilita o certo, e o lint que torna o
    # errado visível. A segunda exigiu um cop, acrescentado na rodada de correção.
    - lib/rubocop/cop/opanel/unscoped_tenant_query.rb
    - .rubocop.yml
    # Os Commands e Queries que passam a atravessá-la.
    - app/commands/create_team.rb
    - app/commands/suspend_team_member.rb
    - app/queries/teams_for_user.rb
    - app/controllers/teams_controller.rb
    # AF-07 passa a avaliar código real; a lista de mutações críticas é dado.
    - config/architecture/fitness.yml
    # Testes.
    - spec/unit/application_policy_spec.rb
    - spec/policies/role_matrix_spec.rb
    - spec/policies/cross_team_mutations_spec.rb
    - spec/integration/tenant_scope_spec.rb
    - spec/security/authorization_disclosure_spec.rb
    - spec/gates/authorization_coverage_spec.rb
    - spec/gates/unscoped_tenant_query_spec.rb
    - spec/support/authorization.rb

  # O AuditLog. Toca os Commands que já existem porque a Story pede que as ações
  # de identidade do M01 passem a auditar — a fundação só vale provada contra as
  # ações reais, não contra um exemplo. Sem UI: a consulta é de M11-11.
  M01-05:
    - db/migrate/*_create_audit_logs.rb
    - db/schema.rb
    - lib/opanel/identifier.rb
    - spec/unit/identifier_spec.rb
    # Domínio e a instrumentação que torna auditar o caminho curto.
    - app/models/audit_log.rb
    - app/audit/audit_trail.rb
    - app/audit/audit_sanitizer.rb
    - app/queries/audit_trail_for_resource.rb
    # Os Commands que passam a auditar, e a camada de autorização que passa a
    # registrar DENIED — que fecha também o F-7 da M01-04.
    - app/commands/create_team.rb
    - app/commands/suspend_team_member.rb
    - app/commands/revoke_session.rb
    - app/commands/register_user.rb
    - app/commands/authenticate_user.rb
    - app/commands/bootstrap_installation.rb
    - lib/opanel/authorization.rb
    - config/architecture/fitness.yml
    # Testes.
    - spec/factories/audit_logs.rb
    - spec/unit/audit_sanitizer_spec.rb
    - spec/unit/audit_actions_spec.rb
    - spec/integration/audit_log_append_only_spec.rb
    - spec/integration/audit_trail_spec.rb
    - spec/policies/audit_denied_spec.rb
    - spec/security/audit_redaction_spec.rb
    # Não rodam em transação, e esta Story fez os fluxos deles gravarem trilha:
    # sem limpar `audit_logs` eles passam a contaminar os arquivos seguintes.
    - spec/integration/installation_bootstrap_concurrency_spec.rb
    - spec/integration/instance_role_revocation_concurrency_spec.rb
