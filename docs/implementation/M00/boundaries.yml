    - bin/stop-gate
    - lib/gates/pack.rb
    - lib/gates/stop_gate.rb
    - config/pack/**
    - spec/gates/pack_spec.rb
    - spec/gates/stop_gate_spec.rb
    - docs/implementation/README.md
    # Widened during the fix of CODEX_REVIEW_01, deliberately.
