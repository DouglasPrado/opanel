  M00-12:
    - bin/gate
    - bin/install-hooks
    - .githooks/**
    - lib/gates/story_boundary.rb
    - lib/gates/post_commit.rb
    - bin/setup
    - spec/gates/gate_scripts_spec.rb
    - docs/engineering/quality-gates.md
    # Widened deliberately, with the reason, rather than silently.
    #
    # AC9 requires a measured pre-commit budget, and the first measurement was
    # 13s — bypass territory, and the Story's own failure scenario names the
    # remedy ("escopo incremental por diff; check pesado migra para CI, nunca é
    # removido"). Applying it reaches four files that M00-12 does not own:
    #
    #   bin/security       `--staged` scans the staged diff (9.2s -> 0.2s). The
    #                      CI job still scans the whole tree and the history.
    #   bin/test           `--fast` drops the `:slow` gate suites, which shell
    #                      out to other gates. CI still runs them.
    #   spec/spec_helper   where `:slow` is defined, and where the JUnit file
    #                      name is built.
    #   bin/test-metadata  the same run id, so the evidence describes the run
    #                      that produced it.
    - bin/security
    - bin/test
    - bin/test-metadata
    - spec/spec_helper.rb
    - spec/gates/**
    # Widened during the fix of CODEX_REVIEW_01, deliberately.
    #
    # M00-R06 asks the gate to run the *related* tests rather than the changed
    # spec files, and M00-R07 to read reviews and acceptance criteria in their
    # canonical form instead of matching a word. Neither is expressible inside
    # bin/gate: the selection and the two readers are libraries the gate calls,
    # and inlining them would put three parsers in a shell script.
    - lib/gates/related_specs.rb
    - lib/gates/acceptance_mapping.rb
    - lib/gates/review_findings.rb

  M00-14:
