    # M00-R08 requires config/pack/tasks.schema.json to be *applied* rather than
    # described, which is a validator; M00-R07 requires the Stop Gate to read the
    # reviews and the criteria that exist. Both are libraries the Story's own
    # scripts call.
    - lib/gates/json_schema.rb
    - lib/gates/acceptance_mapping.rb
    - lib/gates/review_findings.rb
    # The loop's own bookkeeping, which this Story established: the state file the
    # orchestrator reads between phases, the independent review it persists, and
    # the fix report that answers it. Same category as MILESTONE_REPORT.md, which
    # lib/gates/story_boundary.rb already allows everywhere — named here rather
    # than added there, because widening a declaration is a reviewable act and
    # editing the checker is not.
    - docs/implementation/*/review-state.json
    - docs/implementation/*/CODEX_REVIEW_*.md
    - docs/implementation/*/FIX_REPORT_*.md

